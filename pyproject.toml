[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "milo-robot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.14.3", "sounddevice==0.5.6", "piper-tts==1.8.0", "pyserial==3.5", "webrtcvad-wheels==2.0.14"]

[project.optional-dependencies]
edge-languages = ["pyopenjtalk-plus==0.4.1.post9", "pydantic==2.13.5", "SudachiPy==0.6.11", "SudachiDict-core==20260723"]

[tool.setuptools.packages.find]
include = ["milo_next*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
